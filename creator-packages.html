<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina paket | Promptbanken</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
</head>
<body class="workspace-page">
    <header class="workspace-topbar">
        <a class="workspace-brand" href="index.html">Promptbanken</a>
        <nav>
            <a href="creator.html">Mitt bibliotek</a>
            <a href="creator-content.html">Prompts</a>
            <a href="creator-packages.html">Paket</a>
            <a href="creator-shares.html">Delat</a>
            <a href="creator-profile.html">Profil</a>
            <a href="promptbanken.html">Utforska Open</a>
            <strong data-creator-packages-user-email hidden>-</strong>
            <button type="button" data-creator-packages-logout hidden>Logga ut</button>
        </nav>
    </header>

    <main class="workspace-shell" aria-labelledby="creator-packages-title">
        <div class="workspace-heading">
            <div>
                <p class="workspace-kicker">Mitt bibliotek</p>
                <h1 id="creator-packages-title">Paket</h1>
            </div>
        </div>

        <p class="workspace-status" role="status" data-creator-packages-status>Laddar...</p>

        <section class="workspace-empty" data-creator-packages-login-needed hidden>
            <h2>Du är inte inloggad</h2>
            <p>Logga in för att bygga, använda och dela paket.</p>
            <p><a href="login.html">Till inloggningen</a></p>
        </section>

        <div data-creator-packages-content hidden>
            <details class="workspace-section creator-composer" id="new-package">
                <summary>+ Skapa paket</summary>
                <div class="creator-composer-body">
                <h2>Nytt paket</h2>
                <div class="workspace-form">
                    <label>Titel <input type="text" data-new-draft-title></label>
                    <label>Beskrivning <textarea data-new-draft-summary rows="2"></textarea></label>
                </div>

                <fieldset class="package-type-choice">
                    <legend>Vilken sorts paket?</legend>
                    <label class="package-type-card">
                        <input type="radio" name="package-type" value="collection" data-new-draft-type checked>
                        <span>
                            <strong>Samling</strong>
                            Mallar som hör ihop. Användaren väljer själv vilken hen behöver.
                        </span>
                    </label>
                    <label class="package-type-card">
                        <input type="radio" name="package-type" value="workflow" data-new-draft-type>
                        <span>
                            <strong>Workflow</strong>
                            Steg som körs i ordning, från början till färdigt resultat.
                        </span>
                    </label>
                </fieldset>

                <p class="field-error" data-new-draft-error role="alert" hidden></p>
                <button type="button" data-new-draft-btn>Skapa paket-utkast</button>
                </div>
            </details>

            <div data-draft-list></div>
        </div>

        <template data-draft-row-template>
            <article class="workspace-section" data-draft-id>
                <div class="workspace-section-heading">
                    <h2 data-draft-title>-</h2>
                    <span class="library-state-pills">
                        <strong class="status-badge" data-draft-access-badge>Privat</strong>
                        <strong class="status-badge" data-draft-open-badge hidden></strong>
                    </span>
                </div>
                <p data-draft-summary></p>
                <p class="package-type-badge" data-draft-type-badge></p>
                <p class="creator-library-note" data-draft-reference-note hidden>Följer Promptbanken. Innehållet läses live ur katalogen och kan inte redigeras här.</p>
                <p class="mp-hint is-error" data-draft-review-note hidden></p>
                <p data-draft-count-hint></p>
                <div data-draft-items></div>
                <div class="creator-row-actions library-primary-actions">
                    <button type="button" class="primary-btn package-item-preview-btn" data-draft-preview-btn hidden>Använd paket</button>
                    <a class="secondary-btn" data-draft-share-link href="creator-shares.html">Dela</a>
                    <button type="button" class="danger-btn" data-draft-delete-btn hidden>Ta bort paket</button>
                </div>
                <div class="package-preview" data-draft-preview hidden></div>
                <div data-draft-add-row hidden>
                    <select data-draft-add-select></select>
                    <button type="button" data-draft-add-btn>Lägg till</button>
                </div>
                <details class="open-distribution" data-draft-open-details>
                  <summary>Publicera i Promptbanken Open</summary>
                  <p class="mp-hint">Bara den inskickade versionen granskas. Ditt privata paket fortsätter fungera som vanligt.</p>
                <fieldset class="creator-consent-group" data-draft-consent-group>
                    <legend>Spridning utanför Promptbanken</legend>
                    <label class="creator-consent"><input type="checkbox" data-draft-consent-distribution> Paketet får distribueras via Promptbanken Open till externa AI-klienter, till exempel ChatGPT</label>
                    <label class="creator-consent"><input type="checkbox" data-draft-rights-attested> Innehållet är mitt eget, eller jag har rätt att sprida det</label>
                    <p class="creator-consent-hint">Båda krävs för spridning utanför Promptbanken. Lämnar du dem tomma publiceras paketet ändå — men bara på webben.</p>
                </fieldset>
                <p class="field-error" data-draft-error role="alert" hidden></p>
                <button type="button" data-draft-submit-btn hidden>Skicka in för granskning</button>
                <button type="button" data-draft-withdraw-btn hidden>Dra tillbaka</button>
                </details>
            </article>
        </template>

        <template data-draft-item-template>
            <div class="package-item-row" data-item-content-item-id>
                <span data-item-title></span>
                <span class="package-item-actions">
                    <button type="button" class="package-item-reorder-btn" data-item-up-btn hidden aria-label="Flytta upp">
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12V4M4 8l4-4 4 4"></path></svg>
                    </button>
                    <button type="button" class="package-item-reorder-btn" data-item-down-btn hidden aria-label="Flytta ner">
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v8M4 8l4 4 4-4"></path></svg>
                    </button>
                    <button type="button" class="package-item-remove-btn" data-item-remove-btn hidden>Ta bort</button>
                </span>
            </div>
        </template>
    </main>

    <script type="module" src="src/creatorPackages.js"></script>
</body>
</html>
